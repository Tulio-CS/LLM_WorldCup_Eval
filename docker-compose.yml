# Coolify / Docker Compose deployment.
#
# Serves the FastAPI dashboard (fifa_forecast/web.py) on port 8000, backed by a
# persistent volume for the dataset. Coolify writes the env vars you define in
# its UI into the .env file that `env_file` loads; locally, put them in .env.
# Coolify "Scheduled Tasks" / the terminal can exec the CLI in this container:
#   python -m fifa_forecast fetch --results
#   python -m fifa_forecast run --date 2026-06-27

services:
  web:
    build: .
    container_name: fifa-llm-eval
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Persist all generated state on the volume (overrides the image defaults).
      FIFA_DATA_DIR: /data
      FIFA_DB_PATH: /data/fifa_forecasts.db
      FIFA_MATCHES_CSV: /data/matches.csv
    volumes:
      # Named volume → survives redeploys/restarts. Holds the SQLite DB and the
      # JSON archive (raw_requests, raw_responses, traces, metadata, exports)
      # plus the matches CSV (seeded on first boot by docker-entrypoint.sh).
      - fifa-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  fifa-data:
