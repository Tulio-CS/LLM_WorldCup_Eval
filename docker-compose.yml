services:
  web:
    build: .
    container_name: fifa-llm-eval
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      FIFA_DATA_DIR: /data
      FIFA_DB_PATH: /data/fifa_forecasts.db
    volumes:
      # Named volume → survives redeploys/restarts. Holds the SQLite DB and the
      # JSON archive (raw_requests, raw_responses, traces, metadata, exports).
      - fifa-data:/data
    restart: unless-stopped

volumes:
  fifa-data:
